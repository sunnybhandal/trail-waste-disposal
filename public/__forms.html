<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trail Waste Disposal Forms</title>
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="address" type="text" />
      <input name="businessType" type="text" />
      <input name="serviceType" type="text" />
      <input name="dumpsterSize" type="text" />
      <input name="quantity" type="text" />
      <input name="pickupFrequency" type="text" />
      <input name="pickupDay" type="text" />
    </form>
  </body>
</html>
